# XcodeGen spec -- run `xcodegen generate` on a Mac to produce HRV.xcodeproj.
# Declarative so we never hand-edit a .pbxproj. Track G.
name: HRV
options:
  bundleIdPrefix: com.bar009
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

packages:
  HRVCore:
    path: .            # this folder holds Package.swift (the verified core)

targets:
  HRV:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: HRVCore
      - target: HRVWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bar009.hrvc
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/HRV.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

  HRVWatch:
    type: application
    platform: watchOS
    sources: [WatchApp]
    dependencies:
      - package: HRVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bar009.hrvc.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.bar009.hrvc
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
