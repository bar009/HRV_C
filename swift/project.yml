# XcodeGen spec -- run `xcodegen generate` on a Mac to produce HRV.xcodeproj.
# Declarative so we never hand-edit a .pbxproj. Track G.
name: HRV
options:
  bundleIdPrefix: com.bar009
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

packages:
  HRVCore:
    path: .            # this folder holds Package.swift (the verified core)

# Shared scheme so `xcodebuild -scheme HRV` (mac-xcode.sh) works headless,
# not only after Xcode auto-creates schemes on first open.
schemes:
  # iPhone-only: builds the app WITHOUT the embedded watch app, so it works
  # even when the watchOS simulator runtime isn't installed (macOS evicts
  # runtimes under disk pressure). Use the full HRV scheme for watch work.
  HRV-Phone:
    build:
      targets:
        HRV-Phone: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HRVAppTests
    archive:
      config: Release
  HRV:
    build:
      targets:
        HRV: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  HRV:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: HRVCore
        product: HRVCore
      - target: HRVWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bar009.hrvc
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/HRV.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "4"

  # Same app without the watch embed -- see the HRV-Phone scheme comment.
  # This is the target we ship to TestFlight/App Store (iPhone-only first
  # build; the watch app follows once its own App ID/profile are set up).
  HRV-Phone:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: HRVCore
        product: HRVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bar009.hrvc
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/HRV.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "4"
        DEVELOPMENT_TEAM: RVCPD5FJ46
      configs:
        # Debug stays automatic so simulator builds/tests need no profile.
        Debug:
          CODE_SIGN_STYLE: Automatic
        # Release = manual signing for headless App Store archive/upload on the
        # cloud Mac (reuses the HEX distribution cert + build keychain). The
        # profile UUID is filled once the com.bar009.hrvc App Store profile
        # is created (see the upload steps).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: Bar Cohen (RVCPD5FJ46)"
          PROVISIONING_PROFILE_SPECIFIER: "56885db6-2675-4866-8d10-f68b8159c893"

  # App-layer unit tests (coordinator pipeline, classifier). Hosted by the app
  # because AlertService touches UNUserNotificationCenter, which crashes in an
  # unhosted test runner.
  # Hosted by HRV-Phone (not HRV): HRV embeds the watch app and its build
  # depends on the watchOS simulator runtime, which macOS evicts under disk
  # pressure. Testing app logic shouldn't depend on the watch runtime being
  # present.
  HRVAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: HRV-Phone
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HRV-Phone.app/HRV-Phone
        BUNDLE_LOADER: $(TEST_HOST)
        PRODUCT_BUNDLE_IDENTIFIER: com.bar009.hrvc.tests
        GENERATE_INFOPLIST_FILE: YES

  HRVWatch:
    type: application
    platform: watchOS
    sources: [WatchApp]
    dependencies:
      - package: HRVCore
        product: HRVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bar009.hrvc.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        # installd rejects the embedded watch app without this key; Xcode only
        # injects it implicitly in some build paths, so state it explicitly.
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.bar009.hrvc
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "4"
